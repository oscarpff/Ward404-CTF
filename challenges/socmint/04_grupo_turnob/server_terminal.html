<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Room 203 - Terminal</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    height: 100%;
    width: 100%;
  }
  
  body {
    background: #0a0a0a;
    font-family: 'Courier New', 'Consolas', monospace;
    color: #00ff00;
    line-height: 1.5;
    overflow: hidden;
  }
  
  .terminal-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
  }
  
  .terminal-header {
    background: #2a2a2a;
    padding: 12px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  
  .terminal-button {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  
  .btn-close { background: #ff5f56; }
  .btn-minimize { background: #ffbd2e; }
  .btn-maximize { background: #27c93f; }
  
  .terminal-title {
    color: #888;
    font-size: 12px;
    margin-left: 8px;
  }
  
  #terminal {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  
  #output {
    flex: 1;
    margin-bottom: 12px;
  }
  
  .output-line {
    margin: 2px 0;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  
  .cmd-echo {
    color: #ffff00;
    margin: 6px 0;
    font-weight: bold;
    background: #2a2a1a;
    padding: 2px 4px;
    border-left: 2px solid #ffff00;
    padding-left: 8px;
  }
  
  .cmd-result {
    color: #00ff00;
    margin: 2px 0;
  }
  
  .prompt-line {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 8px;
  }
  
  .prompt-text {
    color: #888;
    white-space: nowrap;
  }
  
  #cmd-input {
    background: transparent;
    border: none;
    color: #ffff00;
    font-family: inherit;
    font-size: inherit;
    outline: none;
    flex: 1;
    caret-color: #ffff00;
  }
  
  .error { 
    color: #ff6b6b; 
    background: #2a0a0a;
    padding: 2px 4px;
    border-left: 2px solid #ff6b6b;
    padding-left: 8px;
    margin: 2px 0;
  }
  
  .success { 
    color: #51cf66;
    background: #0a2a0a;
    padding: 2px 4px;
    border-left: 2px solid #51cf66;
    padding-left: 8px;
    margin: 2px 0;
  }
  
  .warning { color: #ffd43b; }
  .info { color: #74c0fc; }
  
  .flag { 
    color: #000;
    background: #ffd700;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
    margin: 6px 0;
  }
  
  .login-box {
    background: #2a2a2a;
    border: 1px solid #444;
    padding: 20px;
    border-radius: 6px;
    max-width: 400px;
    margin: 40px auto;
  }
  
  .login-box h3 {
    color: #00ff00;
    margin-bottom: 16px;
    text-align: center;
  }
  
  .login-box input {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ffff00;
    font-family: inherit;
    border-radius: 4px;
  }
  
  .login-box input::placeholder {
    color: #666;
  }
  
  .login-box button {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    background: #00ff00;
    color: #0a0a0a;
    border: none;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
  }
  
  .login-box button:hover {
    background: #00dd00;
  }
  
  .login-error {
    color: #ff6b6b;
    margin-top: 8px;
    font-size: 14px;
    text-align: center;
  }
  
  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #74c0fc;
    text-decoration: none;
  }
  
  .back-link:hover {
    text-decoration: underline;
  }

  #terminal::-webkit-scrollbar {
    width: 10px;
  }

  #terminal::-webkit-scrollbar-track {
    background: #1a1a1a;
  }

  #terminal::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 5px;
  }

  #terminal::-webkit-scrollbar-thumb:hover {
    background: #555;
  }
</style>
</head>

</div>

      'personnel_timeline.log': `=== PERSONNEL ACTIVITY TIMELINE - TURNO B (NIGHT SHIFT) ===
Date: 2025-10-09 to 2025-10-10

See alert_system.log for detailed system alerts and conclusion.`,

[2025-10-10 00:18:05] CRITICAL: Pattern analysis complete
  Pattern: Coordinated unauthorized access

[2025-10-10 00:25:33] CRITICAL: Evidence flagged for investigation
  Evidence type: System logs, access records, patient database anomalies

  Alert code: PATIENT_COMPROMISED
  Full report: In protocol_violations.log

   Responsible personnel: Turno B night shift + Admin access
   Medical protocol: VIOLATED
   Patient safety: COMPROMISED

      'access_control.log': `=== ACCESS CONTROL SYSTEM LOG ===

Monitoring period: 2025-10-09 20:00 UTC to 2025-10-10 06:00 UTC

--- CREDENTIAL USAGE TIMELINE ---
[2025-10-09 22:30] Access granted: @enf_carlos (Nurse credential)
[2025-10-09 23:20] Access granted: @miguel_admin (Admin credential - UNUSUAL TIME)

    function getFS() {
      return currentRole === 'nurse' ? fileSystemNurse : fileSystemAdmin;
    }
    
    const commands = {
      help: () => `Available commands:
  ls              - List files in current directory
  cat [file]      - Display file contents
  pwd             - Print working directory path
  whoami          - Display current user (investigator)
  clear           - Clear terminal screen
  grep [term]     - Search for term in all files (experimental)
  b64 [base64]    - Decode base64-encoded string
  exit            - Logout and return to login screen
  help            - Show this help menu

--- INVESTIGATION GUIDE ---
Start with: cat README.md
Then explore: access_control.log → personnel_timeline.log → patient_logs.txt
Critical file: alert_system.log (contains incident conclusion)`,
      
      ls: () => Object.keys(getFS()).join('\n'),
      
      pwd: () => '/srv/hospital/room-203/investigations/',
      
      whoami: () => `${currentUser}@server-room-203 (${currentRole === 'nurse' ? 'Supervisor - Turno B' : 'admin'})`,
      
      grep: (args) => {
        const searchTerm = args.join(' ').toLowerCase();
        if (!searchTerm) return '<span class="error">grep: missing search term</span>';
        
        let results = [];
        for (const [filename, content] of Object.entries(getFS())) {
          if (content.toLowerCase().includes(searchTerm)) {
            const lines = content.split('\n');
            const matches = lines.filter(line => line.toLowerCase().includes(searchTerm));
            results.push(`\n--- ${filename} ---`);
            results.push(...matches.slice(0, 3));
          }
        }
        return results.length > 1 ? results.join('\n') : `<span class="error">grep: No matches found for "${searchTerm}"</span>`;
      },
      
      cat: (args) => {
        const filename = args[0];
        if (!filename) return '<span class="error">cat: missing file operand</span>';
        const fs = getFS();
        if (fs[filename]) return fs[filename];
        return `<span class="error">cat: ${filename}: No such file or directory</span>`;
      },

      b64: (args) => {
        const data = (args || []).join(' ').trim();
        if (!data) return '<span class="error">b64: missing base64 input</span>';
        try {
          const decoded = atob(data);
          return decoded || '<span class="warning">(decoded to empty string)</span>';
        } catch (e) {
          return '<span class="error">b64: invalid base64</span>';
        }
      },

      su: (args) => {
        const target = args[0];
        const pw = args[1];
        if (!target || !pw) return '<span class="error">su: usage: su <usuario> <clave></span>';
        const cred = validCredentials.find(c => c.username.toLowerCase() === target.toLowerCase() && c.pass === pw && c.role === 'nurse');
        if (cred) {
          currentUser = cred.username;
          currentRole = cred.role;
          addOutput('Elevated privileges to supervisor (enf_carlos). Full logs unlocked.', 'success');
          return null;
        }
        return '<span class="error">su: authentication failed</span>';
      },
      
      clear: () => {
        output.innerHTML = '';
        return null;
      },
      
      exit: () => {
        addOutput('Logging out from investigation session...', 'success');
        setTimeout(() => {
          terminalContainer.style.display = 'none';
          loginScreen.style.display = 'block';
          loginId.value = '';
          loginPass.value = '';
          loginError.textContent = '';
        }, 1000);
        return null;
      }
    };
    
    function addOutput(text, cssClass = '', isCommand = false) {
      if (text === null) return;
      const line = document.createElement('div');
      line.className = 'output-line' + (cssClass ? ' ' + cssClass : '');
      line.innerHTML = text;
      output.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }
    
    function processCommand(input) {
      const trimmed = input.trim();
      if (!trimmed) return;
      
      // Mostrar comando introducido
      addOutput(`$ ${trimmed}`, 'cmd-echo');
      // Guardar en historial
      history.push(trimmed);
      historyIndex = history.length;
      
      const parts = trimmed.split(' ');
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1);
      
      if (commands[cmd]) {
        const result = commands[cmd](args);
        if (result !== null) {
          addOutput(result, 'cmd-result');
        }
      } else {
        addOutput(`bash: ${cmd}: command not found`, 'error');
      }
    }
    
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const cmd = cmdInput.value;
        processCommand(cmd);
        cmdInput.value = '';
      } else if (e.key === 'Tab') {
        e.preventDefault();
        handleTabCompletion();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (history.length > 0) {
          if (historyIndex === history.length) {
            // si estamos al final, mostrar el último
            historyIndex = history.length - 1;
          } else if (historyIndex > 0) {
            historyIndex--;
          }
          cmdInput.value = history[historyIndex] || '';
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (history.length > 0) {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            cmdInput.value = history[historyIndex];
          } else {
            // salir del historial
            historyIndex = history.length;
            cmdInput.value = '';
          }
        }
      }
    });
    
    function handleTabCompletion() {
      const input = cmdInput.value.trim();
      const parts = input.split(' ');
      const currentPart = parts[parts.length - 1];
      
      // Si es el primer argumento, buscar comandos
      if (parts.length === 1) {
        const allCommands = Object.keys(commands);
        const matches = allCommands.filter(cmd => cmd.startsWith(currentPart.toLowerCase()));
        
        if (matches.length === 1) {
          cmdInput.value = matches[0] + ' ';
        } else if (matches.length > 1) {
          addOutput(`Available: ${matches.join(', ')}`, 'info');
        }
      } 
      // Si es argumento de cat, buscar archivos
      else if (parts.length === 2 && parts[0].toLowerCase() === 'cat') {
        const allFiles = Object.keys(getFS());
        const matches = allFiles.filter(file => file.toLowerCase().startsWith(currentPart.toLowerCase()));
        
        if (matches.length === 1) {
          cmdInput.value = parts[0] + ' ' + matches[0];
        } else if (matches.length > 1) {
          addOutput(`Files: ${matches.join(', ')}`, 'info');
        }
      }
      
      cmdInput.focus();
    }
    
    // Welcome message
    addOutput('✓ Connection established', 'success');
    addOutput(`Welcome ${currentUser} - Saint Anima Hospital Server Room 203`, 'info');
    addOutput(`Role: ${currentRole === 'nurse' ? 'Supervisor - Turno B (full access)' : 'Admin (limited access)'}`, 'info');
    addOutput('Type <span class="warning">help</span> for available commands.\n', 'cmd-result');
    
    cmdInput.focus();
  }
})();
</script>
