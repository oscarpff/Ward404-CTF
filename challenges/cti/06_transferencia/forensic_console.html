<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forensic Console — Incident Response</title>
<link rel="stylesheet" href="../../../templates/style.css">
<style>
  body { background:#0a0a0a; color:#00ff00; font-family: 'Courier New', monospace; }
  .terminal-container { height: 100vh; display:flex; flex-direction:column; background:#1a1a1a; }
  .terminal-header { background:#2a2a2a; padding:12px 16px; border-bottom:1px solid #333; display:flex; align-items:center; gap:8px; }
  .title { color:#888; font-size:12px; }
  #terminal { flex:1; display:flex; flex-direction:column; padding:20px; overflow:auto; }
  #output { flex:1; }
  .output-line { white-space:pre-wrap; word-break:break-word; margin:2px 0; }
  .cmd-echo { color:#ffff00; background:#2a2a1a; padding:2px 6px; border-left:2px solid #ffff00; font-weight:bold; }
  .cmd-result { color:#00ff00; }
  .error { color:#ff6b6b; background:#2a0a0a; padding:2px 6px; border-left:2px solid #ff6b6b; }
  .success { color:#51cf66; background:#0a2a0a; padding:2px 6px; border-left:2px solid #51cf66; }
  .prompt { display:flex; gap:8px; align-items:center; }
  .prompt-text { color:#888; }
  #cmd { background:transparent; border:none; outline:none; color:#ffff00; flex:1; font-family:inherit; font-size:inherit; }
  a.btn { display:inline-block; background:#3b82f6; color:#fff; padding:6px 10px; border-radius:6px; text-decoration:none; }
</style>
</head>
<body>
<div class="terminal-container">
  <div class="terminal-header">
    <div>
      <span class="title">forensic@ir-system:~ — Incident Response Forensic Console</span>
      <span style="display: block; font-size: 10px; color: #666; margin-top: 4px;">Ref: HSA-CTF-2025 · Unidad: Planta 4 · Medicina Interna</span>
    </div>
    <span style="flex:1"></span>
    <a class="btn" href="resource.html">← Volver</a>
  </div>
  <div id="terminal">
    <div id="output"></div>
    <div class="prompt">
      <span class="prompt-text">forensic@ir-system:~$</span>
      <input id="cmd" type="text" autocomplete="off" autofocus>
    </div>
  </div>
</div>

<script>
(function(){
  const output = document.getElementById('output');
  const cmd = document.getElementById('cmd');

  const README = `Forensic Console — Incident Response System
Comandos disponibles:
  help                 Muestra esta ayuda
  ls                   Lista archivos capturados durante la exfiltración
  inspect <hash>       Inspecciona detalles técnicos del archivo
  strings <hash>       Extrae fragmentos de texto legibles del archivo
  verify <hash>        Valida el archivo y revela contenido si es correcto
  clear                Limpia la consola
  exit                 Cierra la sesión

Contexto: Durante la ventana de exfiltración (01:52-01:53 UTC), el sistema interceptó múltiples archivos transferidos hacia 185.125.190.58:9443. Debes identificar cuál contiene datos sensibles del paciente SA-0404-999.

Sugerencia: usa 'ls' para ver los archivos, 'inspect' para revisar metadata técnica, 'strings' para extraer fragmentos de texto, y 'verify' para confirmar el correcto.
`;

  const CAPTURED_FILES = [
    { hash: 'a3f7b12c8e6d9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5', name: 'system_metrics_20251010.dat', size: '2.1 MB', timestamp: '2025-10-10 01:48:12', type: 'telemetry', strings: ['CPU_LOAD', 'MEM_USAGE', 'DISK_IO', 'NET_THROUGHPUT', 'SYS_UPTIME'] },
    { hash: 'b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9', name: 'backup_config_v2.tar.gz', size: '512 KB', timestamp: '2025-10-10 01:49:55', type: 'config', strings: ['DB_HOST', 'LDAP_SERVER', 'SMTP_CONFIG', 'FIREWALL_RULES', 'TLS_CERT'] },
    { hash: 'c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5', name: 'patient_batch_20251010.enc', size: '18.4 MB', timestamp: '2025-10-10 01:52:03', type: 'medical-data', patient_id: 'SA-0404-999', strings: ['SA-0404', 'Julio', 'Sainz', 'Anima', 'fMRI', 'neural_response', 'biometric_scan', 'Dr_Mora', 'protocol_v3'] },
    { hash: 'd1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1', name: 'log_aggregated_Oct.zip', size: '8.3 MB', timestamp: '2025-10-10 01:53:21', type: 'logs', strings: ['LOGIN_SUCCESS', 'AUTH_FAIL', 'SESSION_TIMEOUT', 'HTTP_200', 'ERROR_404'] },
    { hash: 'e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9', name: 'db_snapshot_staging.sql', size: '4.7 MB', timestamp: '2025-10-10 01:54:10', type: 'database', strings: ['INSERT INTO', 'CREATE TABLE', 'FOREIGN KEY', 'INDEX patients', 'UPDATE users'] },
    { hash: 'f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3', name: 'audit_trail_partial.json', size: '920 KB', timestamp: '2025-10-10 01:55:42', type: 'audit', strings: ['user_id', 'action_type', 'resource_accessed', 'timestamp_utc', 'ip_origin'] }
  ];

  const commands = {
    help(){ return README; },
    clear(){ output.innerHTML = ''; return null; },
    exit(){ add('Cerrando sesión forense...', 'success'); setTimeout(()=>{ window.location.href = 'resource.html'; }, 600); return null; },
    ls(){
      let out = 'Archivos capturados durante la ventana de exfiltración:\n\n';
      out += 'HASH                                                             SIZE       TIMESTAMP            NAME\n';
      out += '──────────────────────────────────────────────────────────────── ────────── ──────────────────── ────────────────────────────────────\n';
      CAPTURED_FILES.forEach(f=>{
        out += `${f.hash} ${f.size.padEnd(10)} ${f.timestamp} ${f.name}\n`;
      });
      return out;
    },
    inspect(args){
      const hash = args[0];
      if(!hash) return err('inspect: usage inspect <hash>');
      const file = CAPTURED_FILES.find(f=>f.hash.startsWith(hash) || hash.startsWith(f.hash.substring(0,16)));
      if(!file) return err('Hash no encontrado en archivos capturados.');
      
      let out = `=== Archivo: ${file.name} ===\n`;
      out += `Hash (SHA256): ${file.hash}\n`;
      out += `Tamaño: ${file.size}\n`;
      out += `Timestamp: ${file.timestamp}\n`;
      out += `Tipo: ${file.type}\n`;
      out += `Compresión: ${file.type === 'config' || file.type === 'logs' ? 'gzip' : 'none'}\n`;
      out += `Cifrado: ${file.type === 'medical-data' ? 'AES-256 (parcial)' : 'none'}\n`;
      return out;
    },
    strings(args){
      const hash = args[0];
      if(!hash) return err('strings: usage strings <hash>');
      const file = CAPTURED_FILES.find(f=>f.hash.startsWith(hash) || hash.startsWith(f.hash.substring(0,16)));
      if(!file) return err('Hash no encontrado.');
      
      if(!file.strings || file.strings.length === 0){
        return err('No se encontraron strings legibles en este archivo (binario puro o cifrado completo).');
      }
      
      let out = `=== Strings extraídos de ${file.name} ===\n`;
      out += file.strings.map((s,i) => `[${i}] ${s}`).join('\n');
      out += `\n\nTotal: ${file.strings.length} fragmentos encontrados.`;
      return out;
    },
    verify(args){
      const hash = args[0];
      if(!hash) return err('verify: usage verify <hash>');
      const file = CAPTURED_FILES.find(f=>f.hash.startsWith(hash) || hash.startsWith(f.hash.substring(0,16)));
      if(!file) return err('Hash no encontrado.');
      
      if(file.patient_id === 'SA-0404-999'){
        return success(`✓ Archivo verificado: ${file.name}\n\nCONTENIDO DESCIFRADO:\n- Paciente: SA-0404-999 (Julio Sainz Morales)\n- Tipo de datos: Registros biométricos completos, fMRI pre-protocolo Anima, historial de respuesta a estímulos neuronales\n- Destino confirmado: 185.125.190.58:9443 (nodo de exfiltración)\n- Evidencia: Datos sensibles del experimento "Anima" extraídos sin autorización\n\nESTADO: EXFILTRACIÓN CONFIRMADA\n\nFlag: FLAG{DATA_EXFILTRATED}`);
      } else {
        return err(`Archivo verificado, pero no contiene datos del paciente SA-0404-999.\nSigue buscando...`);
      }
    }
  };

  function add(text, cls){
    if(text===null) return;
    const div=document.createElement('div');
    div.className='output-line '+(cls||'');
    div.textContent=text;
    output.appendChild(div);
    const term=document.getElementById('terminal');
    term.scrollTop=term.scrollHeight;
  }
  function echo(s){ add('$ '+s, 'cmd-echo'); }
  function err(s){ return s; }
  function success(s){ return s; }

  function run(input){
    const line=(input||'').trim(); if(!line) return;
    echo(line);
    const parts=line.split(/\s+/); const c=parts[0].toLowerCase(); const args=parts.slice(1);
    if(commands[c]){ 
      const res=commands[c](args); 
      if(res!==null){
        const cls = res.includes('FLAG{') ? 'success' : (res.startsWith('Hash no') || res.startsWith('Archivo verificado, pero') ? 'error' : 'cmd-result');
        add(res, cls);
      }
    } else {
      add(`command not found: ${c}`,'error');
    }
  }

  let history = [];
  let historyIndex = -1;

  cmd.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ 
      const input = cmd.value.trim();
      if(input){
        history.push(input);
        historyIndex = history.length;
      }
      run(cmd.value); 
      cmd.value=''; 
    }
    else if(e.key==='Tab') { e.preventDefault(); handleTabCompletion(); }
    else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(history.length > 0 && historyIndex > 0){
        historyIndex--;
        cmd.value = history[historyIndex];
      }
    }
    else if(e.key==='ArrowDown'){
      e.preventDefault();
      if(historyIndex < history.length - 1){
        historyIndex++;
        cmd.value = history[historyIndex];
      } else if(historyIndex === history.length - 1){
        historyIndex = history.length;
        cmd.value = '';
      }
    }
  });

  function handleTabCompletion(){
    const input = (cmd.value || '').trim();
    const parts = input.split(/\s+/).filter(Boolean);
    const current = parts[parts.length-1] || '';

    const allCommands = Object.keys(commands);
    const allHashes = CAPTURED_FILES.map(f => f.hash.substring(0, 16));

    function complete(list){
      const matches = list.filter(x => x.toLowerCase().startsWith(current.toLowerCase()));
      if(matches.length === 1){
        parts[parts.length-1] = matches[0];
        cmd.value = parts.join(' ') + (parts.length === 1 ? ' ' : '');
      } else if(matches.length > 1){
        add(`Disponibles: ${matches.join(', ')}`, 'cmd-result');
      }
    }

    if(parts.length === 1){
      complete(allCommands);
    } else if((parts[0].toLowerCase() === 'inspect' || parts[0].toLowerCase() === 'verify') && parts.length === 2){
      complete(allHashes);
    }
  }

  add('✓ Conexión establecida con Incident Response System','success');
  add(commands.help(), 'cmd-result');
})();
</script>
</body>
</html>
