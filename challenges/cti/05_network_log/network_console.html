<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTI Console — Sala 203</title>
<link rel="stylesheet" href="../../../templates/style.css">
<style>
  body { background:#0a0a0a; color:#00ff00; font-family: 'Courier New', monospace; }
  .terminal-container { height: 100vh; display:flex; flex-direction:column; background:#1a1a1a; }
  .terminal-header { background:#2a2a2a; padding:12px 16px; border-bottom:1px solid #333; display:flex; align-items:center; gap:8px; }
  .title { color:#888; font-size:12px; }
  #terminal { flex:1; display:flex; flex-direction:column; padding:20px; overflow:auto; }
  #output { flex:1; }
  .output-line { white-space:pre-wrap; word-break:break-word; margin:2px 0; }
  .cmd-echo { color:#ffff00; background:#2a2a1a; padding:2px 6px; border-left:2px solid #ffff00; font-weight:bold; }
  .cmd-result { color:#00ff00; }
  .error { color:#ff6b6b; background:#2a0a0a; padding:2px 6px; border-left:2px solid #ff6b6b; }
  .success { color:#51cf66; background:#0a2a0a; padding:2px 6px; border-left:2px solid #51cf66; }
  .prompt { display:flex; gap:8px; align-items:center; }
  .prompt-text { color:#888; }
  #cmd { background:transparent; border:none; outline:none; color:#ffff00; flex:1; font-family:inherit; font-size:inherit; }
  a.btn { display:inline-block; background:#3b82f6; color:#fff; padding:6px 10px; border-radius:6px; text-decoration:none; }
</style>
</head>
<body>
<div class="terminal-container">
  <div class="terminal-header">
    <div>
      <span class="title">analyst@netmon:~ — Consola de Investigación CTI (Sala 203)</span>
      <span style="display: block; font-size: 10px; color: #666; margin-top: 4px;">Ref: HSA-CTF-2025 · Unidad: Planta 4 · Medicina Interna</span>
    </div>
    <span style="flex:1"></span>
    <a class="btn" href="resource.html">← Volver</a>
  </div>
  <div id="terminal">
    <div id="output"></div>
    <div class="prompt">
      <span class="prompt-text">analyst@netmon:~$</span>
      <input id="cmd" type="text" autocomplete="off" autofocus>
    </div>
  </div>
</div>

<script>
 (function(){
  const output = document.getElementById('output');
  const cmd = document.getElementById('cmd');

  const TEXT = {
    readme: `NetMon — Segmento 203 (Rastreo de tráfico)
Comandos disponibles:
  help                    Muestra esta ayuda
  ls                      Lista archivos disponibles
  cat                     Muestra el contenido de un fichero
  grep                    Busca patrón (si omites fichero, busca en todos)
  analyze                 Cruza logs con la lista interna de vigilancia
  whoami                  Usuario actual
  clear                   Limpia la consola
  exit                    Cierra la sesión

Objetivo: identificar la conexión saliente sospechosa desde la estación 10.203.5.18 y confirmarla contra los indicadores internos.
`,
    errMissingFile: 'cat: missing file',
    errNotFound: 'cat: file not found',
    errGrepUsage: 'grep: usage grep <pattern> [file]',
    errGrepFile: 'grep: file not found',
    errGrepMulti: 'grep: multiple matches: ',
    errNoMatches: '(no matches)',
    errAnalyzeUsage: 'analyze: usage analyze <IP>',
    errAnalyzeIp: 'Formato de IP inválido.',
    errAnalyzeNone: 'No hay tráfico registrado hacia ese destino.',
    errAnalyzePort: (expected, seen) => `Destino en vigilancia encontrado, pero puerto no coincide (esperado ${expected}, visto ${seen}).`,
    errUnknown: (cmd) => `command not found: ${cmd}`,
    successConnected: '✓ Enlace establecido con NetMon — segmento 203',
    exitMsg: 'Cerrando sesión de la consola CTI...'
  };

  function tr(key, params){
    const v = TEXT[key];
    if(typeof v === 'function') return v(params?.expected, params?.seen) || v(params?.cmd);
    return v;
  }

  const NET_LOG = `=== net_traffic.log ===
[2025-10-10 01:42:18] SRC=10.203.5.18 DST=45.142.212.61 SVC=HTTPS PORT=443 BYTES_OUT=2048 BYTES_IN=1024
[2025-10-10 01:44:07] SRC=10.203.5.18 DST=10.10.10.5 SVC=HTTPS PORT=443 BYTES_OUT=512 BYTES_IN=256
[2025-10-10 01:47:51] SRC=10.203.5.18 DST=162.244.83.71 SVC=HTTPS PORT=8443 BYTES_OUT=10240 BYTES_IN=5120
[2025-10-10 01:49:33] SRC=10.203.5.18 DST=192.168.203.10 SVC=SSH PORT=22 BYTES_OUT=2048 BYTES_IN=4096
[2025-10-10 01:51:12] SRC=10.203.5.18 DST=23.106.223.97 SVC=HTTPS PORT=443 BYTES_OUT=3072 BYTES_IN=1536
[2025-10-10 01:52:03] SRC=10.203.5.18 DST=185.125.190.58 SVC=HTTPS PORT=9443 BYTES_OUT=18432 BYTES_IN=512
[2025-10-10 01:52:59] SRC=10.203.5.18 DST=185.125.190.58 SVC=HTTPS PORT=9443 BYTES_OUT=9216 BYTES_IN=320
[2025-10-10 01:55:14] SRC=10.203.5.18 DST=78.47.204.93 SVC=HTTPS PORT=443 BYTES_OUT=2048 BYTES_IN=1024
[2025-10-10 01:58:22] SRC=10.203.5.18 DST=185.220.101.43 SVC=HTTPS PORT=443 BYTES_OUT=4096 BYTES_IN=2048
[2025-10-10 02:01:05] SRC=10.203.5.18 DST=10.203.5.3 SVC=SYSLOG PORT=514 BYTES_OUT=768 BYTES_IN=0
`;

  const FIREWALL = `=== firewall_events.log ===
[2025-10-10 01:46:00] DROP OUT 10.203.5.18 -> 203.0.113.55:23 reason=policy_telnet
[2025-10-10 01:52:04] ALERT OUT 10.203.5.18 -> 185.125.190.58:9443 reason=anomaly_tls_fingerprint
[2025-10-10 01:57:40] DROP OUT 10.203.5.18 -> 212.192.246.30:8080 reason=geo_block
`;

  const NOTES = `=== notes.txt ===
- La estación de Sala 203 (10.203.5.18) debería hablar solo con 10.203.x y 192.168.203.x
- Cualquier salida a internet debe pasar por proxy 10.203.5.3:3128
- Revisar picos de BYTES_OUT hacia destinos no habituales
`;

  function getFiles(){
    return {
      'net_traffic.log': NET_LOG,
      'firewall_events.log': FIREWALL,
      'notes.txt': NOTES
    };
  }

  const watchlist = {
    '185.125.190.58': { port: '9443', description: 'Data exfil node (healthcare targeting)', flag: 'FLAG{NETWORK_ANOMALY}' }
  };

  const commands = {
    help(){ return TEXT.readme; },
    ls(){ return Object.keys(getFiles()).join('\n'); },
    whoami(){ return 'analyst@netmon'; },
    clear(){ output.innerHTML = ''; return null; },
    exit(){ add(tr('exitMsg'), 'success'); setTimeout(()=>{ window.location.href = 'resource.html'; }, 600); return null; },
    cat(args){ const f=args[0]; if(!f) return err(tr('errMissingFile')); const files = getFiles(); if(!(f in files)) return err(tr('errNotFound')); return files[f]; },
    grep(args){
      const pattern = args[0];
      let fname = args[1];
      if(!pattern) return err(tr('errGrepUsage'));
      const re = new RegExp(String(pattern).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');

      const allFiles = Object.keys(getFiles());
      let targets = [];
      if(!fname){
        targets = allFiles.slice();
      } else if(getFiles()[fname] !== undefined){
        targets = [fname];
      } else {
        const candidates = allFiles.filter(f => f.toLowerCase().includes(fname.toLowerCase()));
        if(candidates.length === 0) return err(tr('errGrepFile'));
        if(candidates.length > 1) return err(tr('errGrepMulti') + candidates.join(', '));
        targets = [candidates[0]];
      }

      let out = [];
      const files = getFiles();
      for(const f of targets){
        const lines = files[f].split('\n').filter(l=>re.test(l));
        if(lines.length){
          if(targets.length > 1) out.push(`==> ${f} <==`);
          out.push(...lines);
        }
      }
      return out.join('\n') || tr('errNoMatches');
    },
    analyze(args){
      const ip = args[0];
      if(!ip) return err(tr('errAnalyzeUsage'));
      const ipRe = /^(\d{1,3}\.){3}\d{1,3}$/;
      if(!ipRe.test(ip)) return err(tr('errAnalyzeIp'));

      const lines = NET_LOG.split('\n').filter(l=>l.includes(ip));
      if(lines.length === 0) return err(tr('errAnalyzeNone'));

      const watch = watchlist[ip];
      if(!watch) return lines.join('\n');

      let port = '?'; let stamp = '?';
      const m = /\[(.*?)\].*PORT=(\d+)/.exec(lines[0]);
      if(m){ stamp = m[1]; port = m[2]; }

      if(port !== watch.port){
        return err(tr('errAnalyzePort', { expected: watch.port, seen: port }));
      }

      return success(`Destino crítico detectado en ${stamp} -> ${ip}:${port}\nDescriptor: ${watch.description}\nFLAG: ${watch.flag}`);
    }
  };

  function add(text, cls){
    if(text===null) return;
    const div=document.createElement('div');
    div.className='output-line '+(cls||'');
    div.innerHTML=text;
    output.appendChild(div);
    const term=document.getElementById('terminal');
    term.scrollTop=term.scrollHeight;
  }
  function echo(s){ add('$ '+s, 'cmd-echo'); }
  function err(s){ return `<span class="error">${s}</span>`; }
  function success(s){ return `<span class="success">${s}</span>`; }

  function run(input){
    const line=(input||'').trim(); if(!line) return;
    echo(line);
    const parts=line.split(/\s+/); const c=parts[0].toLowerCase(); const args=parts.slice(1);
    if(commands[c]){ const res=commands[c](args); if(res!==null) add(res,'cmd-result'); }
    else add(tr('errUnknown', { cmd: c }), 'error');
  }

  let history = [];
  let historyIndex = -1;

  cmd.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ 
      const input = cmd.value.trim();
      if(input){
        history.push(input);
        historyIndex = history.length;
      }
      run(cmd.value); 
      cmd.value=''; 
    }
    else if(e.key==='Tab') { e.preventDefault(); handleTabCompletion(); }
    else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(history.length > 0 && historyIndex > 0){
        historyIndex--;
        cmd.value = history[historyIndex];
      }
    }
    else if(e.key==='ArrowDown'){
      e.preventDefault();
      if(historyIndex < history.length - 1){
        historyIndex++;
        cmd.value = history[historyIndex];
      } else if(historyIndex === history.length - 1){
        historyIndex = history.length;
        cmd.value = '';
      }
    }
  });

  function handleTabCompletion(){
    const input = (cmd.value || '').trim();
    const parts = input.split(/\s+/).filter(Boolean);
    const current = parts[parts.length-1] || '';

    const allCommands = Object.keys(commands);
    const allFiles = Object.keys(getFiles());
    const ipSet = new Set();
    (NET_LOG.match(/DST=([0-9.]+)/g) || []).forEach(match=>{
      const ip = match.split('=')[1];
      if(ip) ipSet.add(ip);
    });
    const allIps = Array.from(ipSet);

    function complete(list){
      const matches = list.filter(x => x.toLowerCase().startsWith(current.toLowerCase()));
      if(matches.length === 1){
        parts[parts.length-1] = matches[0];
        cmd.value = parts.join(' ') + (parts.length === 1 ? ' ' : '');
      } else if(matches.length > 1){
        add(`Available: ${matches.join(', ')}`, 'cmd-result');
      }
    }

    if(parts.length === 1){
      complete(allCommands);
    } else if(parts[0].toLowerCase() === 'cat' && parts.length === 2){
      complete(allFiles);
    } else if(parts[0].toLowerCase() === 'grep' && parts.length === 3){
      complete(allFiles);
    } else if(parts[0].toLowerCase() === 'analyze' && parts.length === 2){
      complete(allIps);
    }
  }

  add(tr('successConnected'),'success');
  add(commands.help(), 'cmd-result');
})();
</script>
</body>
</html>
