<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ward 404 - CTF</title>
  <!-- Optional Google Font; will load if online. Falls back to system fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="templates/style.css">
  <style>
    :root{--landing-bg:linear-gradient(135deg,#eaf6fb,#f7fbff 40%);--accent:#0b6fa4}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--landing-bg);display:flex;align-items:center;justify-content:center}
  .launch-wrap{max-width:980px;padding:36px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.9), #fff);box-shadow:0 30px 80px rgba(8,24,40,0.08);text-align:center;position:relative;z-index:2}
    .brand{font-family:'Bebas Neue', system-ui, Arial, sans-serif;font-size:84px;line-height:0.88;color:var(--accent);letter-spacing:1px;text-shadow:0 6px 28px rgba(11,111,164,0.12);margin:6px 0}
    .subtitle{color:#365660;margin-bottom:20px;font-weight:600}
  .play-btn{display:inline-flex;align-items:center;gap:12px;padding:18px 26px;background:var(--accent);color:white;border-radius:999px;text-decoration:none;font-weight:800;font-size:18px;border:0;box-shadow:0 14px 40px rgba(11,111,164,0.18);transition:transform .14s ease,box-shadow .14s ease;line-height:1}
    .play-btn:hover{transform:translateY(-4px);box-shadow:0 22px 60px rgba(11,111,164,0.2)}
  .play-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:14px;padding:0;background:transparent}
    /* pulse animation */
    @keyframes pulse {0%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:0.95}100%{transform:scale(1);opacity:1}}
    .play-btn.animated{animation:pulse 2000ms ease-in-out infinite}
    .hint{margin-top:18px;color:#5b6b6f}
    @media (max-width:560px){.brand{font-size:48px}.play-btn{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <div class="launch-wrap">
    <div style="display:flex;align-items:center;justify-content:center;flex-direction:column">
      <div class="brand" aria-hidden="true">Ward 404</div>
      <div class="subtitle">CTF · Simulated hospital investigation</div>
      <a class="play-btn animated" href="intro.html" id="cta-play" title="Play Ward 404 CTF">
        
        <span>PLAY</span>
      </a>
      <div class="hint">Click Play to enter the CTF.</div>
      <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #ddd; color: #666; font-size: 0.85em;">
        <p>Hospital Saint Anima CTF — Óscar Pérez Fernández · 2025</p>
      </div>
    </div>
  </div>
  <img class="watermark" src="assets/logo_saint_anima.png" alt="Saint Anima watermark" aria-hidden="true">
  <script>
    // small keyboard accessibility: Enter or Space on focused button goes to intro
    document.getElementById('cta-play').addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.currentTarget.click(); }
    });
    // subtle entrance animation on load
    window.addEventListener('load', function(){
      const btn = document.getElementById('cta-play');
      setTimeout(()=> btn.classList.add('glow'), 400);
    });
  </script>
</body>
</html>
